<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><link rel="stylesheet" href="rj-theme.css">
<style>body{padding:20px;max-width:720px;margin:auto}</style></head><body>
<div id="rjFlow"></div>
<div id="editGuide"></div>
<script>
const STAGES=['profile তৈরি','Save','Unlock (২৳)','Visa সাইট খুলুন','Fill করুন'];
const cur=1, action='✏️ profile-টি "Edit" করে সব ট্যাব (Mission→References) যাচাই ও "Save" করুন → তারপর ঐ profile row-তে "🔓 Unlock (2 TK)" চাপুন।';
const chips=STAGES.map((s,i)=>{const done=i<cur,isC=i===cur;const bg=done?'#0b6b4e':isC?'linear-gradient(135deg,#0b6b4e,#12b886)':'#e8eef7';const col=(done||isC)?'#fff':'#41506a';return `<span style="background:${bg};color:${col};border-radius:14px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap">${done?'✓ ':(i+1)+'. '}${s}</span>`;}).join('<span style="color:#9aa7ba">›</span>');
document.getElementById('rjFlow').innerHTML='<div style="background:var(--card);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;padding:12px 14px;margin-bottom:14px"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px">'+chips+'</div><div style="font-size:14px;font-weight:700;color:var(--brand);line-height:1.5">'+action+'</div></div>';
document.getElementById('editGuide').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:9px;padding:8px 12px;margin:8px 0"><div style="font-size:13px;color:#065f46;font-weight:700">ট্যাব 2/9: A. Personal — এই ট্যাবের ঘরগুলো দেখে নিন।</div><button style="background:linear-gradient(135deg,#0b6b4e,#12b886);border:none;color:#fff;font-weight:800;border-radius:8px;padding:6px 14px;font-size:13px">পরের ট্যাব: B. Passport ▶</button></div>';
</script></body></html>
