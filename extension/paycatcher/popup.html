<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #0d0d1e; color: #e0e0f0; }
  .h { padding: 10px 12px; background: linear-gradient(90deg,#0a0a18,#16162f,#0a0a18); border-bottom: 1px solid rgba(124,58,237,.3); font-weight: 800; font-size: .82rem; color: #c4b5fd; }
  .b { padding: 11px 12px; }
  .lbl { font-size: .6rem; color: #8888aa; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
  .tid { font: 700 .66rem Consolas, monospace; color: #c4b5fd; word-break: break-all; margin-bottom: 8px; }
  textarea { width: 100%; height: 84px; resize: vertical; box-sizing: border-box; padding: 6px; border-radius: 6px; border: 1px solid #34d399; background: #12122c; color: #4ade80; font: 600 .56rem Consolas, monospace; margin-bottom: 8px; }
  .st { font: 700 .64rem Consolas, monospace; color: #fcd34d; margin-bottom: 9px; min-height: 1rem; word-break: break-all; }
  .row { display: flex; gap: 6px; }
  button { flex: 1; padding: 7px 0; border: 0; border-radius: 6px; color: #fff; font-weight: 800; font-size: .66rem; cursor: pointer; }
  #cp { background: linear-gradient(135deg,#6366f1,#4f46e5); }
  #fire { background: linear-gradient(135deg,#10b981,#059669); }
  #rst { background: #333; flex: 0 0 auto; padding: 7px 10px; }
</style>
</head>
<body>
  <div class="h">🎯 RJ Payment Callback Catcher</div>
  <div class="b">
    <div class="lbl">tran_id</div>
    <div class="tid" id="tid">— waiting —</div>
    <div class="lbl">callback URL (tran_id + data)</div>
    <textarea id="url" readonly placeholder="Pay → the callback (with data) will be caught here automatically."></textarea>
    <div class="st" id="st">waiting…</div>
    <div class="row">
      <button id="cp">Copy fetch</button>
      <button id="fire">▶ Fire now</button>
      <button id="rst">Reset</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
